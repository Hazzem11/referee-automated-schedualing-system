server:
  # Railway/Render inject PORT; defaults to 8080 locally.
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        same-site: lax

spring:
  application:
    name: referee-availability
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/referee}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
  mail:
    # SendGrid SMTP relay — username is literally "apikey", password is the API key.
    # Leave SENDGRID_API_KEY unset to run in log-only mode (emails printed to console).
    host: smtp.sendgrid.net
    port: 587
    username: apikey
    password: ${SENDGRID_API_KEY:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  # Public base URL used in invite emails (no trailing slash).
  base-url: ${APP_BASE_URL:http://localhost:3000}
  # Demo profile exposes demo credentials on the login page and seeds demo users.
  demo: false
  notifications:
    # Master switch: real emails only when true AND SENDGRID_API_KEY is set.
    enabled: ${NOTIFICATIONS_ENABLED:false}
    from: ${NOTIFICATIONS_FROM:assignments@demo.ovbabo.ca}
    from-name: ${NOTIFICATIONS_FROM_NAME:OVBABO Assignments}
    # Comma-separated assigner inbox(es) for the publish digest.
    assigner-emails: ${ASSIGNER_EMAILS:}

spring.jackson:
  serialization:
    write-dates-as-timestamps: false
  deserialization:
    adjust-dates-to-context-time-zone: false

logging:
  level:
    com.example.referee: INFO
